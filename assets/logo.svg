<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="ow-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="ow-grad-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="ow-grad-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.3" />
    </linearGradient>
    <filter id="ow-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ow-grad-bg)" stroke="#27272A" stroke-width="1.5" />

  <!-- Outer Concentric Dynamic Sound Wave Ring -->
  <circle cx="32" cy="32" r="22" stroke="url(#ow-grad-ring)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" />

  <!-- Stylized Open Voice Capsule / Microphone Shape -->
  <rect x="26" y="16" width="12" height="20" rx="6" fill="url(#ow-grad-accent)" filter="url(#ow-glow)" />

  <!-- Audio Waveform Pickup Arc -->
  <path d="M21 28 C21 37.5, 43 37.5, 43 28" stroke="#FDE68A" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Base Stand and Audio Pulse Node -->
  <line x1="32" y1="38" x2="32" y2="46" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="32" cy="46" r="2.5" fill="#FDE68A" />

  <!-- Small Harmonic Audio Pulse Dots -->
  <circle cx="16" cy="32" r="1.5" fill="#F59E0B" opacity="0.8" />
  <circle cx="48" cy="32" r="1.5" fill="#F59E0B" opacity="0.8" />
</svg>
